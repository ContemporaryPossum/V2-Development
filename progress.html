<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Site Progress | V2 Development</title>
  <meta name="description" content="Construction photographs from every active V2 Development site in Selangor, updated regularly.">
  <link rel="canonical" href="https://v2-d.com/progress">
  <meta name="theme-color" content="#3b0e18">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="V2 Development">
  <meta property="og:title" content="Site Progress | V2 Development">
  <meta property="og:description" content="Watch every V2 home rise, site by site.">
  <meta property="og:image" content="https://v2-d.com/progress-harmoni-14.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..700&family=Instrument+Serif&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="progress">
  <div class="curtain" aria-hidden="true"><span class="curtain__mark display">V2</span></div>

  <main id="main">
    <section class="phero phero--short" id="top" data-header="light">
      <div class="phero__media"><img src="progress-harmoni-14.jpg" alt="" fetchpriority="high" data-parallax-img></div>
      <div class="phero__inner wrap">
        <p class="label" data-hero>Construction updates</p>
        <h1 class="display d-xl" data-split data-hero>Site<br>progress</h1>
        <p class="script phero__script" data-hero>built in the open</p>
      </div>
    </section>

    <section class="section t-ivory" data-header="dark">
      <div class="wrap split-grid">
        <p class="label" data-reveal>Active sites</p>
        <div>
          <h2 class="display d-m" data-split>We photograph every active site and share the progress here, so you can watch your home rise, month by month.</h2>
          <ol class="prog-index" id="progress-index" style="width:100%"></ol>
        </div>
      </div>
    </section>

    <div id="progress-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
